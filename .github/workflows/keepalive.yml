name: Keep Infaan Services Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend and frontend
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 90 --retry 3 --retry-all-errors --retry-delay 5 https://infaan-web-design.onrender.com/api/keepalive/
          curl --fail --silent --show-error --connect-timeout 10 --max-time 90 --retry 3 --retry-all-errors --retry-delay 5 https://infaanwebdesign.vercel.app/
